      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        apiId:
          type: [string, "null"]
          format: uuid
        apiName:
          type: [string, "null"]
        operationId:
          type: [string, "null"]
          format: uuid
        toolName:
          type: [string, "null"]
        method:
          type: [string, "null"]
        path:
          type: [string, "null"]
        eventType:
          type: string
        outcome:
