          type: boolean
        contentTypes:
          type: array
          items:
            type: string
        description:
          type: [string, "null"]
      required: [required, contentTypes, description]
      additionalProperties: false
    ResponseMetadata:
      type: object
      properties:
        statusCode:
          type: string
        description:
          type: [string, "null"]
        contentTypes:
          type: array
          items:
            type: string
      required: [statusCode, description, contentTypes]
      additionalProperties: false
    OperationStateUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
      additionalProperties: false
    ValidationSummary:
      type: object
      properties:
        valid:
          type: boolean
