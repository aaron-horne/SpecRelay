      properties:
        provider:
          type: string
          enum: [jev]
        outcome:
          type: string
          enum: [success, rejected, integration_error, inconclusive]
        testedRevision:
          type: integer
          minimum: 1
        testedAt:
          type: string
          format: date-time
      required: [provider, outcome, testedRevision, testedAt]
      additionalProperties: false
    SemanticProviderDeleteResult:
      type: object
      properties:
        deleted:
          type: boolean
      required: [deleted]
      additionalProperties: false
    SemanticAnalysisProposal:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        apiId: { type: string, format: uuid }
        specificationId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        proposalText: { type: string, minLength: 1, maxLength: 500 }
        proposalKind: { type: string, enum: [description] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        uncertainty: { type: number, minimum: 0, maximum: 1 }
        sourceField: { type: string, maxLength: 40 }
        status: { type: string, enum: [pending, accepted, rejected, stale] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
      required: [id, workspaceId, apiId, specificationId, operationId, proposalText, proposalKind, confidence, uncertainty, sourceField, status, createdAt, decidedAt]
      additionalProperties: false
    SemanticAnalysisResult:
      type: object
      properties:
        outcome: { type: string, enum: [proposal, abstained] }
        specificationId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        confidence: { type: number, minimum: 0, maximum: 1 }
        uncertainty: { type: number, minimum: 0, maximum: 1 }
        proposal:
          oneOf:
            - $ref: "#/components/schemas/SemanticAnalysisProposal"
            - type: "null"
      required: [outcome, specificationId, operationId, confidence, uncertainty, proposal]
      additionalProperties: false
    SemanticProposalDecision:
