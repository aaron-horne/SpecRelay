    ConnectorMetadata:
      type: object
      properties:
        actorId:
          type: string
          format: uuid
        tokenId:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: ["tools:list", "tools:call"]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
