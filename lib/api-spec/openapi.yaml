          type: array
          items:
            $ref: "#/components/schemas/SecurityWarning"
        unsupported:
          type: array
          items:
            type: string
      required: [valid, warnings, unsupported]
      additionalProperties: false
    CredentialMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schemeName:
          type: string
        type:
          type: string
          enum: [API_KEY, BEARER]
        location:
          type: string
          enum: [header, query]
        parameterName:
          type: string
        label:
          type: string
        configured:
          type: boolean
        status:
          type: string
          enum: [ACTIVE, DISABLED, REVOKED]
        destinationHost:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, schemeName, type, location, parameterName, label, configured, status, destinationHost, createdAt, updatedAt]
      additionalProperties: false
    SemanticProviderMetadata:
      type: object
      properties:
        provider:
          type: string
          enum: [jev]
        configured:
          type: boolean
          description: A stored encryption envelope exists; this does not guarantee it is decryptable.
        credentialUsable:
          type: boolean
          description: True only when the server can decrypt the stored credential with its configured key ring.
        enabled:
          type: boolean
          description: Effective future-phase readiness preference; false while rollout is off or the key is undecryptable. No Phase 1A semantic analysis occurs.
        rolloutEnabled:
          type: boolean
          description: True only when both the operator's global gate and this workspace's test allowlist entry are active.
        testCooldownUntil:
          type: ["string", "null"]
          format: date-time
          description: Audit-backed test cooldown expiry, including after credential replacement or recreation.
        credentialRevision:
          type: integer
          minimum: 0
        lastTestedAt:
          type: ["string", "null"]
          format: date-time
        lastTestOutcome:
          type: [string, "null"]
          enum: [success, rejected, integration_error, inconclusive, null]
        testedRevision:
          type: ["integer", "null"]
          minimum: 0
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [provider, configured, credentialUsable, enabled, rolloutEnabled, testCooldownUntil, credentialRevision, lastTestedAt, lastTestOutcome, testedRevision, createdAt, updatedAt]
      additionalProperties: false
    SemanticProviderKeyInput:
      type: object
      properties:
        secret:
          type: string
          minLength: 1
          maxLength: 8192
      required: [secret]
      additionalProperties: false
    SemanticProviderReadyInput:
