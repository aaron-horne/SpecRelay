          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required: [items, page, pageSize, total, totalPages]
      additionalProperties: false
    McpRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          anyOf:
            - type: string
            - type: integer
            - type: "null"
        method:
          type: string
          enum: [server/discover, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true
      required: [jsonrpc, id, method, params]
      additionalProperties: false
    McpResponse:
      type: object
      description: JSON-RPC response containing either a tool list or tool call result.
      additionalProperties: true

