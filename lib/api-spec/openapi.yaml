openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Security-first OpenAPI catalog API for SpecRelay
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspaces
    description: Workspace lifecycle and isolation
  - name: apis
    description: Registered API sources and imported specifications
  - name: operations
    description: Normalized OpenAPI operation catalog
  - name: credentials
    description: Owner-managed API key and Bearer credentials
  - name: semantic-providers
    description: Owner-managed semantic provider configuration
  - name: mcp
    description: Approved MCP tool discovery and invocation
  - name: execution
    description: Read-only execution observability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
  /workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get a workspace
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: MCP-Protocol-Version
          in: header
          required: true
          schema:
            type: string
            const: "2026-07-28"
        - name: Mcp-Method
          in: header
          required: true
          schema:
            type: string
            enum: [server/discover, tools/list, tools/call]
        - name: Mcp-Name
          in: header
          required: false
          description: Required for tools/call and must match params.name.
          schema:
            type: string
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Permanently remove a workspace's active data
      description: >
        OWNER-only destructive operation. The workspace name must be supplied
        exactly as confirmation. Historical audit and security evidence remains
        attached to the workspace tombstone.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceDeletionInput"
      responses:
        "204":
          description: Workspace deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Workspace owner required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Workspace has an active execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspaces/{workspaceId}/overview:
    get:
      operationId: getWorkspaceOverview
      tags: [workspaces]
      summary: Get workspace catalog overview
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Catalog overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceOverview"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      summary: List OWNER-managed connector token metadata
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Safe metadata only; never includes a secret or verifier
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorMetadata"
    post:
      operationId: createConnector
      tags: [connectors]
      summary: Issue a workspace-bound connector token (one-time reveal)
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorInput"
      responses:
        "201":
          description: Token is returned only in this response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorIssued"
  /workspaces/{workspaceId}/connectors/{actorId}/rotate:
    post:
      operationId: rotateConnector
      tags: [connectors]
      summary: Rotate token with five-minute old-token overlap
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Newly issued token, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorIssued"
  /workspaces/{workspaceId}/connectors/{actorId}:
    delete:
      operationId: revokeConnector
      tags: [connectors]
      summary: Revoke all tokens for this service actor
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                required: [revoked]
  /execution-logs:
    get:
      operationId: listExecutionLogs
      tags: [execution]
      summary: List execution audit events
      description: Returns a bounded, read-only view of execution events from workspaces accessible to the authenticated user.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ExecutionOutcome"
        - name: search
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Paginated execution audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis:
    get:
      operationId: listApis
      tags: [apis]
      summary: List registered APIs
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: API list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiSource"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createApi
      tags: [apis]
      summary: Register an API source
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiSourceInput"
      responses:
        "201":
          description: Registered API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis/{apiId}:
    get:
      operationId: getApi
      tags: [apis]
      summary: Get an API source with its latest specification
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
      responses:
        "200":
          description: API source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis/{apiId}/specifications:
    post:
      operationId: importSpecification
      tags: [apis]
      summary: Validate and import an OpenAPI document
      description: >
        Accepts pasted or uploaded JSON/YAML as text. Remote references and
        external documentation are never fetched.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecificationImportInput"
      responses:
        "201":
          description: Imported specification and discovered operations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          description: Specification exceeds the input size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis/{apiId}/credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List safe credential metadata
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
      responses:
        "200":
          description: Credential metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialMetadata"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: saveCredential
      tags: [credentials]
      summary: Create or replace a credential
      description: Secret input is encrypted at rest and never returned.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: Safe credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Workspace owner required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis/{apiId}/credentials/{credentialId}:
    delete:
      operationId: revokeCredential
      tags: [credentials]
      summary: Revoke a credential
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Revoked credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialMetadata"
        "403":
          description: Workspace owner required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/semantic-providers/jev:
    get:
      operationId: getSemanticProvider
      tags: [semantic-providers]
      summary: Get Jev provider configuration metadata
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Safe provider configuration metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticProviderMetadata"
        "403":
          description: Workspace owner required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveSemanticProviderKey
      tags: [semantic-providers]
      summary: Create or replace the Jev API key
      description: Secret input is encrypted at rest, never returned, and invalidates readiness.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticProviderKeyInput"
      responses:
        "200":
          description: Safe provider configuration metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticProviderMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Owner access or same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSemanticProviderKey
      tags: [semantic-providers]
      summary: Delete the Jev API key
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Key deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticProviderDeleteResult"
        "403":
          description: Owner access or same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/semantic-providers/jev/ready:
    patch:
      operationId: setSemanticProviderReady
      tags: [semantic-providers]
      summary: Store or clear a future-phase Jev readiness preference
      description: This preference never starts semantic analysis or automatic Jev egress in Phase 1A.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticProviderReadyInput"
      responses:
        "200":
          description: Updated provider metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticProviderMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Owner access or same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Provider must have a successful test for its current key revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Semantic provider feature is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspaces/{workspaceId}/semantic-providers/jev/refresh-encryption:
    post:
      operationId: refreshSemanticProviderEncryption
      tags: [semantic-providers]
      summary: Re-encrypt a stored Jev key with the current encryption key without contacting Jev
      description: OWNER-only and independent of rollout eligibility. Does not test the connection or change readiness.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Safe provider configuration metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticProviderMetadata"
        "403":
          description: Owner access or same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Stored key cannot be decrypted with the configured key ring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspaces/{workspaceId}/semantic-providers/jev/test:
    post:
      operationId: testSemanticProvider
      tags: [semantic-providers]
      summary: Test the Jev API key using a fixed synthetic request
      description: No caller-controlled host, model, or payload is accepted.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Sanitized test outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticProviderTestResult"
        "403":
          description: Owner access or same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No key is configured or the server-side test cooldown is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Semantic provider feature is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspaces/{workspaceId}/apis/{apiId}/operations/{operationId}/semantic-analysis:
    post:
      operationId: analyzeApiOperation
      tags: [semantic-providers]
      summary: Manually analyze one imported operation with Jev
      description: >
        OWNER-only, same-origin, explicit one-operation analysis. Sends only a
        bounded, redacted operation description to Jev. Jev selects among
        deterministic source-text candidates or abstains; it does not generate
        prose, execute operations, alter MCP, or modify the imported operation.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Typed Jev judgment or abstention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticAnalysisResult"
        "403":
          description: Workspace owner and same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Analysis gate, current operation, or rate limit is not satisfied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Jev analysis is unavailable or disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Jev response was unavailable or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspaces/{workspaceId}/apis/{apiId}/operations/{operationId}/semantic-proposals:
    get:
      operationId: listSemanticProposals
      tags: [semantic-providers]
      summary: List version-bound semantic proposals for one operation
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Proposals with inactive-spec proposals marked stale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SemanticAnalysisProposal"
        "403":
          description: Workspace owner required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis/{apiId}/semantic-proposals/{proposalId}:
    patch:
      operationId: decideSemanticProposal
      tags: [semantic-providers]
      summary: Accept or reject a pending version-bound proposal
      description: Accepting stores a console overlay only; the source operation, MCP, and execution policy are unchanged.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
        - $ref: "#/components/parameters/SemanticProposalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanticProposalDecision"
      responses:
        "200":
          description: Updated proposal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticAnalysisProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Workspace owner and same-origin request required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Proposal is no longer pending or its specification is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workspaces/{workspaceId}/apis/{apiId}/operations:
    get:
      operationId: listOperations
      tags: [operations]
      summary: List normalized API operations
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
      responses:
        "200":
          description: Normalized operation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiOperation"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/apis/{apiId}/operations/{operationId}:
    get:
      operationId: getOperation
      tags: [operations]
      summary: Get an operation detail
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOperation"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateOperationState
      tags: [operations]
      summary: Enable or disable an operation and its execution approval
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ApiId"
        - $ref: "#/components/parameters/OperationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationStateUpdate"
      responses:
        "200":
          description: Updated operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiOperation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /workspaces/{workspaceId}/mcp:
    post:
      operationId: invokeMcp
      tags: [mcp]
      summary: Discover or invoke approved MCP tools
      description: >
        Stateless MCP 2026-07-28 Streamable HTTP endpoint supporting
        server/discover, tools/list, and tools/call. Requests require the
        protocol's per-request metadata and matching MCP-Protocol-Version,
        Mcp-Method, and, for tools/call, Mcp-Name headers. Only
        explicitly approved unauthenticated HTTPS GET operations from the
        latest stored specification are discoverable and executable.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpRequest"
      responses:
        "200":
          description: JSON-RPC result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Operation is not approved for execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Upstream request failed or was denied by the broker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Upstream request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiId:
      name: apiId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SemanticProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
