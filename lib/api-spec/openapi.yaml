                scopes:
                  type: array
                  items:
                    type: string
              required: [scheme, scopes]
              additionalProperties: false
        risk:
          type: string
          enum: [READ_LIKE, WRITE, DESTRUCTIVE, UNKNOWN]
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, apiId, specificationId, method, path, operationId, displayName,
         summary, description, tags, parameters, requestBody, responses,
         securityRequirements, securityGroups, risk, enabled, createdAt, updatedAt]
      additionalProperties: false
    ApiSecurityScheme:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [apiKey, http, unsupported]
        location:
          type: [string, "null"]
          enum: [header, query, null]
        parameterName:
          type: [string, "null"]
        bearer:
          type: boolean
      required: [name, type, location, parameterName, bearer]
      additionalProperties: false
    OperationParameter:
      type: object
