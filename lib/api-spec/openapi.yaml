          $ref: "#/components/schemas/ApiSpecVersion"
        operations:
          type: array
          items:
            $ref: "#/components/schemas/ApiOperation"
        validation:
          $ref: "#/components/schemas/ValidationSummary"
      required: [specification, operations, validation]
      additionalProperties: false
    ApiSpecVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
          format: uuid
        version:
          type: string
        format:
          type: string
          enum: [json, yaml]
        openapiVersion:
          type: string
        documentHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        serverUrls:
          type: array
          items:
            type: string
        securitySchemes:
          type: array
          items:
            $ref: "#/components/schemas/ApiSecurityScheme"
        validationWarnings:
          type: array
          items:
            $ref: "#/components/schemas/SecurityWarning"
        importedAt:
          type: string
          format: date-time
      required: [id, apiId, version, format, openapiVersion, documentHash, serverUrls, securitySchemes, validationWarnings, importedAt]
      additionalProperties: false
    ApiOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        apiId:
          type: string
          format: uuid
        specificationId:
          type: string
          format: uuid
        method:
          type: string
        path:
          type: string
        operationId:
          type: [string, "null"]
        displayName:
          type: string
        summary:
          type: [string, "null"]
        description:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/OperationParameter"
        requestBody:
          anyOf:
            - $ref: "#/components/schemas/RequestBodyMetadata"
            - type: "null"
        responses:
          type: array
          items:
            $ref: "#/components/schemas/ResponseMetadata"
        securityRequirements:
          type: array
          items:
            type: string
        securityGroups:
          type: array
          items:
