    ApiSourceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, "null"]
      required: [name]
      additionalProperties: false
    ApiDetail:
      type: object
      properties:
        api:
          $ref: "#/components/schemas/ApiSource"
        operations:
          type: array
