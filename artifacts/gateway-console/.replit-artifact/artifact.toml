kind = "web"
previewPath = "/"
title = "SpecRelay"
description = "A security-first developer console for importing OpenAPI documents, configuring managed API-key and Bearer credentials, and exposing explicitly approved HTTPS GET operations as governed MCP tools."
version = "1.0.0"
id = "artifacts/gateway-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20383

[services.development]
run = "pnpm --filter @workspace/gateway-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gateway-console", "run", "build" ]
serve = "static"
publicDir = "artifacts/gateway-console/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20383"
BASE_PATH = "/"
