name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specrelay_test
  # Deterministic public test fixture: 32 repeated "A" bytes, never for production.
  CREDENTIAL_ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
  CREDENTIAL_ENCRYPTION_KEY_ID: ci-test-only
  CREDENTIAL_ENCRYPTION_KEY_VERSION: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d specrelay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API clients
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Verify generated API clients are committed
        run: git diff --exit-code

      - name: Verify PostgreSQL readiness
        run: pg_isready --dbname="$DATABASE_URL" --timeout=5

      - name: Apply application database migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Run checks
        run: pnpm run check

      - name: Run security tests
        run: pnpm run test:security

      - name: Validate migrations without skips
        run: pnpm run migration:validate

      - name: Build production artifacts
        run: pnpm run build
